<form id="bank-form"
      hx-patch="/api/banks/{{ bank.id }}/"
      hx-target="#toast"
      hx-swap="outerHTML"
      class="space-y-6">

    <div>
        <div id="toast"></div>

        <label class="block text-sm font-semibold mb-2">
            Bank Name
        </label>

        <input type="text"
               id="name"
               name="name"
               value="{{ bank.name }}"
               class="w-full bg-gray-50 border-2 border-gray-400 rounded-lg px-4 py-3">
    </div>

    <div class="grid grid-cols-1 md:grid-cols-4 gap-4">

        <div>
            <label class="block text-sm font-semibold mb-2">Bank Code</label>
            <input type="text" id="bank_code" name="code" value="{{ bank.code }}">
        </div>

        <div>
            <label class="block text-sm font-semibold mb-2">Branch Code</label>
            <input type="text" id="branch_code" name="branch_code" value="{{ bank.branch_code }}">
        </div>

        <div>
            <label class="block text-sm font-semibold mb-2">SWIFT/BIC</label>
            <input type="text" id="bic" name="swift" value="{{ bank.swift }}">
        </div>

        <div>
            <label class="block text-sm font-semibold mb-2">Rib Key</label>
            <input type="text" name="rib_key" value="{{ bank.rib_key }}">
        </div>

    </div>

    <div>
        <label class="block text-sm font-semibold mb-2">
            Account Holder
        </label>

        <input type="text"
               id="account_holder"
               name="holder_name"
               value="{{ bank.holder_name }}">
    </div>

    <div>
        <label class="block text-sm font-semibold mb-2">
            Bank Address
        </label>

        <input type="text"
               id="address"
               name="adresse"
               value="{{ bank.adresse }}">
    </div>

    <div class="grid grid-cols-1 md:grid-cols-2 gap-4">

        <div>
            <label class="block text-sm font-semibold mb-2">Phone</label>
            <input type="text" id="phone" name="phone" value="{{ bank.phone }}">
        </div>

        <div>
            <label class="block text-sm font-semibold mb-2">Email</label>
            <input type="text" id="email" name="email" value="{{ bank.email }}">
        </div>

    </div>

    <div class="grid grid-cols-1 md:grid-cols-3 gap-4">

        <div>
            <label class="block text-sm font-semibold mb-2">ZIP Code</label>
            <input type="text" id="zip_code" name="zip_code" value="{{ bank.zip_code }}">
        </div>

    </div>

    <div class="pt-6 flex justify-end">
        <button type="submit"
                class="px-8 py-3 bg-emerald-600 text-white font-semibold rounded-xl hover:bg-emerald-700">
            Save Changes
        </button>
    </div>

</form>
