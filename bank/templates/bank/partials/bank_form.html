<form method="POST"
      hx-post="/api/banks/"
      hx-target="#toast"
      hx-swap="outerHTML"
      class="space-y-6">

      <div>
        <div id="toast"></div>
        <label class="block text-sm font-semibold mb-2">
            Bank Name
        </label>
        <input type="text"
                id="name"
                name="name"
                class="w-full bg-gray-50 border-2 border-gray-400 rounded-lg px-4 py-3 shadow-sm focus:outline-none focus:ring-2 focus:ring-blue-500 focus:border-blue-500">
    </div>

    <!-- Codes Row -->
    <div class="grid grid-cols-1 md:grid-cols-4 gap-4">

        <div>
            <label class="block text-sm font-semibold mb-2">
                Bank Code
            </label>
            <input type="text"
                    id="bank_code"
                    maxlength="9"
                    name="code"
                    class="w-full bg-gray-50 border-2 border-gray-400 rounded-lg px-4 py-3 shadow-sm focus:outline-none focus:ring-2 focus:ring-blue-500 focus:border-blue-500">
        </div>

        <div>
            <label class="block text-sm font-semibold mb-2">
                Branch Code
            </label>
            <input type="text"
                    id="branch_code"
                    maxlength="4"
                    name="branch_code"
                    class="w-full bg-gray-50 border-2 border-gray-400 rounded-lg px-4 py-3 shadow-sm focus:outline-none focus:ring-2 focus:ring-blue-500 focus:border-blue-500">
        </div>

        <div>
            <label class="block text-sm font-semibold mb-2">
                SWIFT/BIC
            </label>
            <input type="text"
                    id="bic"
                    maxlength="11"
                    name="swift"
                    class="w-full bg-gray-50 border-2 border-gray-400 rounded-lg px-4 py-3 shadow-sm focus:outline-none focus:ring-2 focus:ring-blue-500 focus:border-blue-500">
        </div>

        <div>
            <label class="block text-sm font-semibold mb-2">
                Rib Key
            </label>
            <input type="text"
                    maxlength="4"
                    name="rib_key"
                    class="w-full bg-gray-50 border-2 border-gray-400 rounded-lg px-4 py-3 shadow-sm focus:outline-none focus:ring-2 focus:ring-blue-500 focus:border-blue-500">
        </div>

    </div>
    <div>
        <label class="block text-sm font-semibold mb-2">
            Account Holder
        </label>
        <input type="text"
                id="account_holder"
                name="holder_name"
                class="w-full bg-gray-50 border-2 border-gray-400 rounded-lg px-4 py-3 shadow-sm focus:outline-none focus:ring-2 focus:ring-blue-500 focus:border-blue-500">
    </div>

    <div>
        <label class="block text-sm font-semibold mb-2">
            Bank Address
        </label>
        <input type="text"
                id="address"
                name="adresse"
                class="w-full bg-gray-50 border-2 border-gray-400 rounded-lg px-4 py-3 shadow-sm focus:outline-none focus:ring-2 focus:ring-blue-500 focus:border-blue-500">
    </div>

    <div class="grid grid-cols-1 md:grid-cols-2 gap-4">

        <div>
            <label class="block text-sm font-semibold mb-2">
                Bank Phone Number
            </label>
            <input type="text"
                    id="phone"
                    name="phone"
                    class="w-full bg-gray-50 border-2 border-gray-400 rounded-lg px-4 py-3 shadow-sm focus:outline-none focus:ring-2 focus:ring-blue-500 focus:border-blue-500">
        </div>

        <div>
            <label class="block email-sm font-semibold mb-2">
                Email
            </label>
            <input type="text"
                    id="email"
                    name="email"
                    class="w-full bg-gray-50 border-2 border-gray-400 rounded-lg px-4 py-3 shadow-sm focus:outline-none focus:ring-2 focus:ring-blue-500 focus:border-blue-500">
        </div>

    </div>

    <!-- Bottom Codes -->
    <div class="grid grid-cols-1 md:grid-cols-3 gap-4">

        <div>
            <label class="block text-sm font-semibold mb-2">
                ZIP Code
            </label>
            <input type="text"
                    id="zip_code"
                    maxlength="7"
                    name="zip_code"
                    class="w-full bg-gray-50 border-2 border-gray-400 rounded-lg px-4 py-3 shadow-sm focus:outline-none focus:ring-2 focus:ring-blue-500 focus:border-blue-500">
        </div>

        <div>
            <label class="block text-sm font-semibold mb-2">
                Country Key
            </label>
            <input type="text"
                    maxlength="4"
                    name="country_key"
                    class="w-full bg-gray-50 border-2 border-gray-400 rounded-lg px-4 py-3 shadow-sm focus:outline-none focus:ring-2 focus:ring-blue-500 focus:border-blue-500">
        </div>
        <input type="hidden" name="user" value="{{ request.user.id }}">

<div>
    <label class="block text-sm font-semibold mb-2">
        Company
    </label>

    <select id="company-select" name="company">
        <option value="">Select company</option>

        {% for company in companies %}
            <option value="{{ company.id }}">
                {{ company.name }}
            </option>
        {% endfor %}
    </select>
    </div>

    <div class="pt-6 flex justify-end">
        <button type="submit"
                class="px-8 py-3 bg-emerald-600 text-white font-semibold rounded-xl hover:bg-emerald-700 transition">
            Validate
        </button>
    </div>

</form>
