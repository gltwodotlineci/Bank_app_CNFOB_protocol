<div class="bg-white rounded-2xl shadow-2xl p-8 border border-gray-200">

    <form method="POST">
        {% csrf_token %}

        <!-- Account Number -->
        <div class="mb-6">
            <label class="block text-sm font-semibold mb-2">
                Account Number
            </label>
            <input type="text"
                   name="account_number"
                   maxlength="20"
                   class="w-full bg-white border border-gray-500 rounded-lg px-4 py-3 shadow-md focus:outline-none focus:ring-2 focus:ring-indigo-500 focus:border-indigo-500 transition">
        </div>

        <!-- Account Type + Currency -->
        <div class="grid grid-cols-1 md:grid-cols-2 gap-4 mb-6">

            <div>
                <label class="block text-sm font-semibold mb-2">
                    Account Type
                </label>
                <select name="account_type"
                        class="w-full bg-white border border-gray-500 rounded-lg px-4 py-3 shadow-md focus:outline-none focus:ring-2 focus:ring-indigo-500">
                    <option value="">Select type</option>
                    <option value="current">Current Account</option>
                    <option value="savings">Savings Account</option>
                    <option value="business">Business Account</option>
                </select>
            </div>

            <div>
                <label class="block text-sm font-semibold mb-2">
                    Currency
                </label>
                <input type="text"
                       name="currency"
                       maxlength="3"
                       placeholder="EUR / USD / GBP"
                       class="w-full bg-white border border-gray-500 rounded-lg px-4 py-3 shadow-md focus:outline-none focus:ring-2 focus:ring-indigo-500">
            </div>

        </div>

        <!-- IBAN -->
        <div class="mb-6">
            <label class="block text-sm font-semibold mb-2">
                IBAN
            </label>
            <input type="text"
                   name="iban"
                   maxlength="34"
                   class="w-full bg-white border border-gray-500 rounded-lg px-4 py-3 shadow-md focus:outline-none focus:ring-2 focus:ring-indigo-500">
        </div>

        <!-- BIC -->
        <div class="mb-6">
            <label class="block text-sm font-semibold mb-2">
                BIC / SWIFT
            </label>
            <input type="text"
                   name="bic"
                   maxlength="11"
                   class="w-full bg-white border border-gray-500 rounded-lg px-4 py-3 shadow-md focus:outline-none focus:ring-2 focus:ring-indigo-500">
        </div>

        <!-- Owner -->
        <div class="mb-6">
            <label class="block text-sm font-semibold mb-2">
                Account Holder
            </label>
            <input type="text"
                   name="account_holder"
                   class="w-full bg-white border border-gray-500 rounded-lg px-4 py-3 shadow-md focus:outline-none focus:ring-2 focus:ring-indigo-500">
        </div>

        <!-- Balance (optional admin field) -->
        <div class="mb-6">
            <label class="block text-sm font-semibold mb-2">
                Initial Balance
            </label>
            <input type="number"
                   step="0.01"
                   name="balance"
                   class="w-full bg-white border border-gray-500 rounded-lg px-4 py-3 shadow-md focus:outline-none focus:ring-2 focus:ring-indigo-500">
        </div>

        <!-- Status -->
        <div class="mb-6">
            <label class="block text-sm font-semibold mb-2">
                Status
            </label>
            <select name="status"
                    class="w-full bg-white border border-gray-500 rounded-lg px-4 py-3 shadow-md focus:outline-none focus:ring-2 focus:ring-indigo-500">
                <option value="active">Active</option>
                <option value="inactive">Inactive</option>
                <option value="blocked">Blocked</option>
            </select>
        </div>

        <!-- Submit -->
        <div class="flex justify-end pt-4">
            <button type="submit"
                    class="px-8 py-3 bg-indigo-600 text-white font-semibold rounded-xl hover:bg-indigo-700 transition">
                Create Account
            </button>
        </div>

    </form>
</div>
