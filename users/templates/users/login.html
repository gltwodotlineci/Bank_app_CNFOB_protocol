
<form hx-post="/api/login/">
    <div class="mb-3">
        <label>Username</label>
        <input type="text"
            name="username"
            class="form-control" id="username">
    </div>

    <div class="mb-3">
        <label>Password</label>
        <input type="password"
            name="password"
            class="form-control" id="logpass">
    </div>

    <button class="btn btn-success w-100">
        Login
    </button>
</form>
