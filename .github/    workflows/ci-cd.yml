name: CI/CD for Preprod

on:
  push:
    branches: ["Dev"]
  pull_request:
    branches: ["Dev"]

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v2
      - name: Set up Python
        uses: actions/setup-python@v2
        with:
          python-version: '3.10'

      - name: Install uv
        run: curl -Ls https://astral.sh/uv/install.sh | sh

      - name: Add uv to PATH
        run: echo "$HOME/.local/bin" >> $GITHUB_PATH

      - name: Install dependencies
        run: uv sync

      - name: Run tests
        run: |
          uv run manage.py test bank.tests.unit.test_bank
          uv run manage.py test bank.tests.unit.test_account
          uv run manage.py test users.tests.unit.test_user


  deploy:
    runs-on: ubuntu-latest
    needs: backend-test

    steps:
      - uses: actions/checkout@v3

      - name: Log in to Docker Hub
        uses: docker/login-action@v2
        with:
          username: ${{ secrets.DOCKER_HUB_USERNAME }}
          password: ${{ secrets.DOCKER_HUB_ACCESS_TOKEN_BOOK_AP }}

      - name: Build and push Docker image
        uses: docker/build-push-action@v4
        with:
          context: .
          file: ./docker/Dockerfile
          push: true
          tags: glenllaci/bank_CFNOB_norm:latest

      - name: Trigger deployment on Render.com
        run: curl -X POST ${{ secrets.RENDER_DEPLOY_HOOK_URL }}
